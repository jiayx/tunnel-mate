[workspace]
members = [
  "apps/tunnel-mate-gpui",
  "crates/tunnel-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.6.0"

[profile.release]
lto = "thin"
strip = true

# Keep workspace crates quick to rebuild while making the GPUI rendering stack
# representative enough for local interaction and scrolling checks.
[profile.dev.package."*"]
opt-level = 2
