[package]
name = "tunnel-mate-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI client for Tunnel Mate"

[dependencies]
async-channel = "2.5.0"
auto-launcher = "1.1.0"
chrono = "0.4.45"
dirs = "6.0.0"
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
sys-locale = "0.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
tray-icon = "0.24.2"
tunnel-core = { path = "../../crates/tunnel-core" }
unicode-segmentation = "1.13.3"
uuid = { version = "1.25.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSMenu", "NSResponder", "NSView", "NSWindow"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["AE", "AEDataModel", "AERegistry", "AppleEvents"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString", "objc2-core-services"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.packager]
product-name = "Tunnel Mate"
identifier = "com.jiayx.tunnel-mate"
authors = ["jiayx <i@jiayx.net>"]
homepage = "https://github.com/jiayx/tunnel-mate"
category = "Utility"
icons = [
  "../../assets/icons/32x32.png",
  "../../assets/icons/128x128.png",
  "../../assets/icons/128x128@2x.png",
  "../../assets/icons/icon.icns",
  "../../assets/icons/icon.ico",
]
binaries = [{ path = "tunnel-mate-gpui", main = true }]

[package.metadata.packager.macos]
signing-identity = "-"

[package.metadata.packager.deb]
section = "utils"
depends = [
  "libc6",
  "libgcc-s1",
  "libgtk-3-0",
  "libxdo3",
  "libxcb1",
  "libxkbcommon0",
  "libxkbcommon-x11-0",
  "libwayland-client0",
  "libvulkan1",
  "libayatana-appindicator3-1 | libappindicator3-1",
]
