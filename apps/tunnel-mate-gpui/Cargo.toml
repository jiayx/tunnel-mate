[package]
name = "tunnel-mate-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI client for Tunnel Mate"

[dependencies]
async-channel = "2.5.0"
auto-launcher = "1.0.3"
gpui = { package = "gpui-unofficial", version = "=1.14.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.14.2", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
sys-locale = "0.3.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
tray-icon = "0.24.0"
tunnel-core = { path = "../../crates/tunnel-core" }
unicode-segmentation = "1.13.3"
uuid = { version = "1.18.1", features = ["v4"] }

[package.metadata.packager]
product-name = "Tunnel Mate"
identifier = "com.jiayx.tunnel-mate"
icons = [
  "../../src-tauri/icons/32x32.png",
  "../../src-tauri/icons/128x128.png",
  "../../src-tauri/icons/128x128@2x.png",
  "../../src-tauri/icons/icon.icns",
  "../../src-tauri/icons/icon.ico",
]
binaries = [{ path = "tunnel-mate-gpui", main = true }]
