name: "Build & Release Client"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Test Rust backend
        run: pnpm test:rust

      - name: Lint Rust backend
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm clippy

  build-tauri:
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Builds for Apple Silicon (macOS)
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin --bundles dmg"
            primary_artifact_suffix: "macos_aarch64.dmg"
            primary_artifact_path: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
            extra_artifact_suffix: ""
            extra_artifact_path: ""
          - platform: "macos-latest" # Builds for Intel CPUs (macOS) via cross-compilation
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin --bundles dmg"
            primary_artifact_suffix: "macos_x64.dmg"
            primary_artifact_path: "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"
            extra_artifact_suffix: ""
            extra_artifact_path: ""
          - platform: "ubuntu-22.04" # Builds for Linux (.deb, .AppImage)
            target: ""
            args: "--bundles deb,appimage"
            primary_artifact_suffix: "linux_amd64.deb"
            primary_artifact_path: "src-tauri/target/release/bundle/deb/*.deb"
            extra_artifact_suffix: "linux_amd64.AppImage"
            extra_artifact_path: "src-tauri/target/release/bundle/appimage/*.AppImage"
          - platform: "windows-latest" # Builds for Windows (.msi, .exe)
            target: ""
            args: "--bundles msi,nsis"
            primary_artifact_suffix: "windows_x64.msi"
            primary_artifact_path: "src-tauri/target/release/bundle/msi/*.msi"
            extra_artifact_suffix: "windows_x64-setup.exe"
            extra_artifact_path: "src-tauri/target/release/bundle/nsis/*.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri App
        id: build_tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          # Publish a GitHub Release for the pushed version tag (e.g. v0.1.0)
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup][ext]"
          args: ${{ matrix.args }}

      - name: Upload Primary Build Artifact (for branch testing)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: Tunnel.Mate_${{ steps.build_tauri.outputs.appVersion }}_${{ matrix.primary_artifact_suffix }}
          path: ${{ matrix.primary_artifact_path }}
          archive: false
          if-no-files-found: warn

      - name: Upload Additional Build Artifact (for branch testing)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && matrix.extra_artifact_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Tunnel.Mate_${{ steps.build_tauri.outputs.appVersion }}_${{ matrix.extra_artifact_suffix }}
          path: ${{ matrix.extra_artifact_path }}
          archive: false
          if-no-files-found: warn
