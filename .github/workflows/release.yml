name: Build and release GPUI app

on:
  push:
    branches: [main]
    tags: ["v0.5.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tunnel-mate-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Read and validate workspace version
        shell: bash
        run: |
          version="$(awk '
            /^\[workspace.package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"

          if [[ -z "$version" ]]; then
            echo "Could not read workspace.package.version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v0\.5\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tags must use the v0.5.x version line: $tag" >&2
              exit 1
            fi
            if [[ "$tag" != "v$version" ]]; then
              echo "Tag $tag does not match Cargo version v$version" >&2
              exit 1
            fi
          fi

  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./ -> target"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  security:
    name: Dependency security audit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # main, Node.js 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # russh's RSA-SHA2 support currently depends on RustCrypto RSA. Its
          # constant-time rewrite is still in progress and no patched release
          # exists; keep this exception limited to the tracked upstream issue.
          ignore: RUSTSEC-2023-0071

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [version, quality, security]
    if: startsWith(github.ref, 'refs/tags/v0.5.') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            formats: dmg
            platform: macos
            arch: aarch64
            expected_arch: arm64
          # Build the Intel binary on the faster Apple Silicon runner.
          - os: macos-15
            target: x86_64-apple-darwin
            formats: dmg
            platform: macos
            arch: x86_64
            expected_arch: x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            platform: linux
            arch: x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            formats: wix,nsis
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./ -> target"
          key: ${{ matrix.target }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libvulkan-dev patchelf
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build native client
        run: cargo build --release --locked -p tunnel-mate-gpui --target ${{ matrix.target }}
      - id: macos-signing
        name: Configure macOS signing when credentials are available
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("apps/tunnel-mate-gpui/Cargo.toml")
          with path.open("a") as file:
              file.write("\n[package.metadata.packager.macos]\n")
              file.write(f"signing-identity = {json.dumps(os.environ['APPLE_SIGNING_IDENTITY'])}\n")
          PY
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are absent; producing an unsigned macOS package."
          fi
      - id: windows-signing
        name: Configure Windows signing when credentials are available
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD -and $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "tunnel-mate-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            certutil -user -f -p $env:WINDOWS_CERTIFICATE_PASSWORD -importpfx $certificatePath NoExport
            if ($LASTEXITCODE -ne 0) { throw "Failed to import Windows signing certificate" }
            Add-Content apps/tunnel-mate-gpui/Cargo.toml "`n[package.metadata.packager.windows]"
            Add-Content apps/tunnel-mate-gpui/Cargo.toml "certificate-thumbprint = `"$env:WINDOWS_CERTIFICATE_THUMBPRINT`""
            Add-Content apps/tunnel-mate-gpui/Cargo.toml 'timestamp-url = "http://timestamp.digicert.com"'
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Windows signing secrets are absent; producing unsigned installers."
          }
      - name: Package native client (macOS, with DMG retry)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for attempt in 1 2 3; do
            if cargo packager --manifest-path apps/tunnel-mate-gpui/Cargo.toml --release --target "${{ matrix.target }}" --formats "${{ matrix.formats }}" --out-dir "${{ github.workspace }}/dist" --binaries-dir "${{ github.workspace }}/target/${{ matrix.target }}/release"; then
              exit 0
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "macOS packaging failed after $attempt attempts" >&2
              exit 1
            fi

            echo "DMG packaging attempt $attempt failed; cleaning partial output before retry."
            find dist -maxdepth 1 -type f -name '*.dmg' -delete
            sleep "$((attempt * 5))"
          done
      - name: Package native client (Linux and Windows)
        if: runner.os != 'macOS'
        run: cargo packager --manifest-path apps/tunnel-mate-gpui/Cargo.toml --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --out-dir "${{ github.workspace }}/dist" --binaries-dir "${{ github.workspace }}/target/${{ matrix.target }}/release"
      - name: Normalize macOS package filename
        if: runner.os == 'macOS'
        shell: bash
        run: |
          source_file="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "cargo-packager did not produce a DMG" >&2
            exit 1
          fi
          mv "$source_file" "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.dmg"
      - name: Normalize Linux package filenames
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$deb" || -z "$appimage" ]]; then
            echo "cargo-packager did not produce both DEB and AppImage packages" >&2
            exit 1
          fi
          mv "$deb" "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.deb"
          mv "$appimage" "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.AppImage"
      - name: Normalize Windows package filenames
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem dist -Filter *.msi)
          $installer = @(Get-ChildItem dist -Filter *.exe)
          if ($msi.Count -ne 1 -or $installer.Count -ne 1) {
            throw "cargo-packager did not produce exactly one MSI and one NSIS installer"
          }
          Rename-Item $msi[0].FullName "tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.msi"
          Rename-Item $installer[0].FullName "tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.exe"
      - name: Create Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $binary = "target/${{ matrix.target }}/release/tunnel-mate-gpui.exe"
          if (-not (Test-Path $binary)) { throw "Windows application binary is missing" }

          if ('${{ steps.windows-signing.outputs.configured }}' -eq 'true') {
            signtool.exe sign /sha1 $env:WINDOWS_CERTIFICATE_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $binary
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign Windows portable executable" }
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "tunnel-mate-portable"
          New-Item -ItemType Directory -Force $portableDir | Out-Null
          Copy-Item $binary (Join-Path $portableDir "Tunnel Mate.exe")
          Compress-Archive -Path (Join-Path $portableDir "Tunnel Mate.exe") -DestinationPath "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.dmg"
          test -s "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          binary="$mount_dir/Tunnel Mate.app/Contents/MacOS/tunnel-mate-gpui"
          test -x "$binary"
          file "$binary" | grep -q '${{ matrix.expected_arch }}'
          plist="$mount_dir/Tunnel Mate.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${{ needs.version.outputs.value }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.jiayx.tunnel-mate"
          if [[ '${{ steps.macos-signing.outputs.configured }}' == 'true' ]]; then
            codesign --verify --deep --strict --verbose=2 "$mount_dir/Tunnel Mate.app"
          fi
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.deb"
          appimage="dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.AppImage"
          test -s "$deb"
          test -s "$appimage"
          test "$(dpkg-deb -f "$deb" Version)" = "${{ needs.version.outputs.value }}"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          test "$(dpkg-deb -f "$deb" Section)" = "utils"
          depends="$(dpkg-deb -f "$deb" Depends)"
          grep -q 'libgtk-3-0' <<<"$depends"
          grep -q 'libappindicator3-1' <<<"$depends"

          extract_dir="$(mktemp -d)"
          dpkg-deb --extract "$deb" "$extract_dir"
          binary="$extract_dir/usr/bin/tunnel-mate-gpui"
          test -x "$binary"
          file "$binary" | grep -q 'ELF 64-bit.*x86-64'
          if ldd "$binary" | grep -q 'not found'; then
            ldd "$binary"
            exit 1
          fi
          file "$appimage" | grep -q 'ELF 64-bit.*x86-64'
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-Item "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.msi"
          $installer = Get-Item "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.exe"
          $portable = Get-Item "dist/tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}.zip"

          $msiMagic = [System.IO.File]::ReadAllBytes($msi.FullName)[0..7]
          if ([BitConverter]::ToString($msiMagic) -ne "D0-CF-11-E0-A1-B1-1A-E1") {
            throw "MSI does not have a valid Compound File header"
          }

          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "NSIS installer does not have a valid PE header"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x014C) {
            throw "NSIS bootstrapper is not a valid x86 PE executable"
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "verify-tunnel-mate-portable"
          Expand-Archive $portable.FullName $portableDir
          $portableExe = Get-Item (Join-Path $portableDir "Tunnel Mate.exe")
          $portableBytes = [System.IO.File]::ReadAllBytes($portableExe.FullName)
          if ($portableBytes[0] -ne 0x4D -or $portableBytes[1] -ne 0x5A) {
            throw "Portable app does not have a valid PE header"
          }
          $portablePeOffset = [BitConverter]::ToInt32($portableBytes, 0x3C)
          if ([BitConverter]::ToUInt16($portableBytes, $portablePeOffset + 4) -ne 0x8664) {
            throw "Portable app is not an x86_64 executable"
          }
          if ([BitConverter]::ToUInt16($portableBytes, $portablePeOffset + 24) -ne 0x20B) {
            throw "Portable app is not a PE32+ executable"
          }
          if ([BitConverter]::ToUInt16($portableBytes, $portablePeOffset + 92) -ne 2) {
            throw "Portable app is not using the Windows GUI subsystem"
          }

          Add-Type @"
          using System;
          using System.Runtime.InteropServices;

          public static class PeResources
          {
              private delegate bool EnumResourceNameCallback(
                  IntPtr module,
                  IntPtr resourceType,
                  IntPtr resourceName,
                  IntPtr parameter);

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern IntPtr LoadLibraryEx(
                  string fileName,
                  IntPtr file,
                  uint flags);

              [DllImport("kernel32.dll", EntryPoint = "EnumResourceNamesW", SetLastError = true)]
              private static extern bool EnumResourceNames(
                  IntPtr module,
                  IntPtr resourceType,
                  EnumResourceNameCallback callback,
                  IntPtr parameter);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool FreeLibrary(IntPtr module);

              public static bool HasGroupIcon(string path)
              {
                  const uint LoadLibraryAsDataFile = 0x00000002;
                  const int GroupIconResourceType = 14;

                  IntPtr module = LoadLibraryEx(path, IntPtr.Zero, LoadLibraryAsDataFile);
                  if (module == IntPtr.Zero)
                  {
                      throw new InvalidOperationException("Could not inspect Windows resources");
                  }

                  bool found = false;
                  EnumResourceNameCallback callback = delegate
                  {
                      found = true;
                      return false;
                  };

                  EnumResourceNames(
                      module,
                      new IntPtr(GroupIconResourceType),
                      callback,
                      IntPtr.Zero);
                  FreeLibrary(module);
                  return found;
              }
          }
          "@

          if (-not [PeResources]::HasGroupIcon($portableExe.FullName)) {
            throw "Portable app does not contain a Windows application icon resource"
          }

          if ('${{ steps.windows-signing.outputs.configured }}' -eq 'true') {
            foreach ($package in @($msi, $installer, $portableExe)) {
              $signature = Get-AuthenticodeSignature $package.FullName
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature for $($package.Name): $($signature.Status)"
              }
            }
          }
      - name: Attest release package provenance
        if: startsWith(github.ref, 'refs/tags/v0.5.')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tunnel-mate-${{ needs.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [version, package]
    if: startsWith(github.ref, 'refs/tags/v0.5.')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tunnel Mate $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber

  homebrew:
    name: Update Homebrew Cask
    needs: [version, package, release]
    if: startsWith(github.ref, 'refs/tags/v0.5.')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tunnel-mate-${{ needs.version.outputs.value }}-macos-aarch64
          path: dmg/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tunnel-mate-${{ needs.version.outputs.value }}-macos-x86_64
          path: dmg/x64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jiayx/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update version and checksums
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.version.outputs.value }}
          ARM_DMG: ../dmg/arm64/tunnel-mate-${{ needs.version.outputs.value }}-macos-aarch64.dmg
          X64_DMG: ../dmg/x64/tunnel-mate-${{ needs.version.outputs.value }}-macos-x86_64.dmg
        run: |
          export ARM_SHA="$(sha256sum "$ARM_DMG" | cut -d ' ' -f 1)"
          export X64_SHA="$(sha256sum "$X64_DMG" | cut -d ' ' -f 1)"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Casks/tunnel-mate.rb")
          content = path.read_text()
          content = re.sub(r'version "[^"]+"', f'version "{os.environ["VERSION"]}"', content, count=1)

          def replace_sha(block_name: str, sha: str, source: str) -> str:
              pattern = rf'({block_name} do.*?sha256 ")[^"]+(".*?end)'
              updated, count = re.subn(pattern, rf'\g<1>{sha}\g<2>', source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Could not update {block_name} checksum")
              return updated

          content = replace_sha("on_intel", os.environ["X64_SHA"], content)
          content = replace_sha("on_arm", os.environ["ARM_SHA"], content)
          content = content.replace("# Tauri 默认打包的 macOS 应用文件名\n", "")
          path.write_text(content)
          PY
      - name: Commit Homebrew update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tunnel-mate.rb
          git diff --cached --quiet || git commit -m "chore: bump tunnel-mate to v${{ needs.version.outputs.value }}"
          git push origin main
